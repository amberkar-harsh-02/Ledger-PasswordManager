plugins {
    alias(libs.plugins.android.application)
}

def localProperties = new Properties()
if (rootProject.file("local.properties").exists()) {
    localProperties.load(rootProject.file("local.properties").newDataInputStream())
}

android {
    namespace 'com.example.passmanager'
    compileSdk 36

    defaultConfig {
        applicationId "com.example.passmanager"
        minSdk 31
        targetSdk 36
        versionCode 2
        versionName "1.1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Address of your Ledger relay (relay/ in this repo), e.g. wss://ledger-relay.<account>.workers.dev
        // Not a secret: the relay has no API key and only ever carries end-to-end encrypted messages.
        buildConfigField "String", "RELAY_URL", "\"${localProperties.getProperty('RELAY_URL', '')}\""
    }

    buildFeatures {
        buildConfig = true
    }

    buildTypes {
        release {
            // R8: removes unused code, renames classes/methods and optimizes the rest.
            // shrinkResources then drops layouts/drawables nothing references any more.
            // Keep the mapping file (build/outputs/mapping/release/mapping.txt) of every release
            // you ship; it turns obfuscated crash stack traces back into readable ones.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'uk.co.samuelwall:material-tap-target-prompt:3.3.2'
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    testImplementation libs.junit
    // Real org.json for JVM unit tests (Android's copy is a stub off-device); not shipped in the app
    testImplementation 'org.json:json:20240303'
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    def room_version = "2.8.4" // Keep runtime, compiler and common on one version
    def lifecycle_version = "2.6.2"

    // Room Database
    implementation "androidx.room:room-runtime:$room_version"
    annotationProcessor "androidx.room:room-compiler:$room_version"

    // Lifecycle and LiveData (Needed for your CredentialDao and Repository)
    implementation "androidx.lifecycle:lifecycle-livedata:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-viewmodel:$lifecycle_version"
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0' // 4.10.0 pulled okio 3.0.0 (CVE-2023-3635)
}