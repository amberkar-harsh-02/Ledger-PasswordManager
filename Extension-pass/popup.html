<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ledger</title>
    <style>
        /*
         * Same palette as the Ledger app (app/src/main/res/values/colors.xml): ink blue on cool paper in light mode,
         * slate in dark mode. System UI font, like the app's system Roboto. No remote fonts or images.
         */
        :root {
            color-scheme: light dark;
            --surface: #F4F6F8;
            --surface-container: #EAEEF2;
            --on-surface: #1B2430;
            --on-surface-variant: #4A5563;
            --outline-variant: #C0C7CD;
            --primary: #1F5F7A;
            --attention: #8A5200;
            --error: #B3261E;
            --radius-large: 16px;
            --radius-medium: 12px;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --surface: #14181D;
                --surface-container: #1B2023;
                --on-surface: #E3E7EC;
                --on-surface-variant: #A9B3BF;
                --outline-variant: #40484C;
                --primary: #8CC8E4;
                --attention: #F2B45A;
                --error: #F2B8B5;
            }
        }

        * { box-sizing: border-box; }

        body {
            width: 300px;
            margin: 0;
            padding: 20px;
            background: var(--surface);
            color: var(--on-surface);
            font: 14px/20px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        header {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        header svg { width: 24px; height: 24px; fill: var(--primary); flex: none; }

        h1 {
            margin: 0;
            font-size: 20px;
            line-height: 28px;
            font-weight: 600;
        }

        .lead {
            margin: 8px 0 16px;
            color: var(--on-surface-variant);
        }

        /* The QR code needs a white quiet zone in both themes, or phone cameras struggle */
        .qr {
            width: 212px;
            height: 212px;
            margin: 0 auto;
            padding: 16px;
            background: #FFFFFF;
            border-radius: var(--radius-large);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qr img {
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
        }

        .qr .placeholder {
            color: #4A5563;
            text-align: center;
        }

        /* Check words: the phone shows the same three words for this session */
        .check-words {
            margin: 12px 0 0;
            text-align: center;
            color: var(--on-surface-variant);
        }

        .check-words strong {
            display: block;
            margin-top: 2px;
            color: var(--on-surface);
            font-size: 16px;
            letter-spacing: 0.02em;
        }

        /* A real sequence, so it's numbered */
        ol {
            margin: 16px 0 0;
            padding-left: 20px;
            color: var(--on-surface-variant);
        }

        ol li + li { margin-top: 2px; }

        .status {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            margin-top: 16px;
            padding: 12px;
            border-radius: var(--radius-medium);
            background: var(--surface-container);
            color: var(--on-surface);
        }

        .status svg { width: 20px; height: 20px; flex: none; fill: var(--on-surface-variant); margin-top: 0; }
        .status[data-state="success"] svg { fill: var(--primary); }
        .status[data-state="error"] svg { fill: var(--error); }
        .status[data-state="error"] { color: var(--on-surface); box-shadow: inset 0 0 0 1px var(--error); }

        /* Confirm before filling: which login, into which site */
        .confirm {
            margin-top: 16px;
            padding: 16px;
            border-radius: var(--radius-large);
            background: var(--surface-container);
        }

        .confirm h2 {
            margin: 0;
            font-size: 16px;
            line-height: 24px;
            font-weight: 600;
        }

        .confirm p { margin: 4px 0 0; color: var(--on-surface-variant); overflow-wrap: anywhere; }

        .confirm .warning {
            margin-top: 12px;
            padding: 8px 12px;
            border-radius: 8px;
            color: var(--on-surface);
            box-shadow: inset 3px 0 0 var(--attention);
            background: var(--surface);
        }

        .actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 16px;
        }

        button {
            font: inherit;
            font-weight: 600;
            min-height: 40px;
            padding: 0 16px;
            border-radius: 20px;
            border: 0;
            cursor: pointer;
        }

        button.primary { background: var(--primary); color: var(--surface); }
        button.secondary { background: transparent; color: var(--primary); }
        button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

        @media (prefers-reduced-motion: no-preference) {
            .status { transition: box-shadow 150ms ease-out; }
        }
    </style>
</head>
<body>
<header>
    <!-- Ledger mark ("split shield"), same as the app icon -->
    <svg viewBox="32 20 192 216" aria-hidden="true"><path d="M124 21.45 L128 20 L216 52 V132 Q216 148.83 209.91 164 H124 Z M40 52 L100 30.18 V188 H195.65 Q173.68 215.23 128 236 Q40 196 40 132 Z"/></svg>
    <h1>Ledger</h1>
</header>
<p class="lead">Fill this page with a login from your phone.</p>

<div id="pairing">
    <div class="qr">
        <img id="qr-code" alt="QR code for Ledger on your phone" hidden>
        <span id="qr-placeholder" class="placeholder">Preparing a secure code…</span>
    </div>

    <p id="check-words" class="check-words" hidden>
        Your phone will show <strong id="check-words-value"></strong>
    </p>

    <ol>
        <li>Open Ledger on your phone and tap the login.</li>
        <li>Tap <strong>Fill on computer</strong>.</li>
        <li>Scan this code.</li>
    </ol>
</div>

<!-- Shown once the login arrives: confirm which login goes into which site -->
<section id="confirm" class="confirm" aria-labelledby="confirm-title" hidden>
    <h2 id="confirm-title"></h2>
    <p id="confirm-detail"></p>
    <p id="confirm-warning" class="warning" hidden></p>
    <div class="actions">
        <button id="btn-secondary" class="secondary" type="button"></button>
        <button id="btn-primary" class="primary" type="button"></button>
    </div>
</section>

<div id="status-text" class="status" data-state="waiting" role="status" aria-live="polite">
    <svg viewBox="0 -960 960 960" aria-hidden="true"><path id="status-icon" d=""/></svg>
    <span id="status-message">Connecting…</span>
</div>

<script src="lib/qrcode.js"></script>
<script src="config.js"></script>
<script src="popup.js"></script>
</body>
</html>
